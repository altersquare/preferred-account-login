<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Preferred Account Login</title>
		<!-- Runs before the body parses so the popup never flashes the wrong
		     theme. Must stay a blocking script in <head>. -->
		<script src="theme.js"></script>
		<link rel="stylesheet" href="popup.css" />
	</head>

	<body>
		<header class="topbar">
			<div class="brand">
				<svg
					class="brand-icon"
					viewBox="0 0 128 128"
					xmlns="http://www.w3.org/2000/svg"
					aria-hidden="true"
					focusable="false"
				>
					<defs>
						<linearGradient id="pal-bg" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0" stop-color="#5b93f7" />
							<stop offset="1" stop-color="#1a5fd0" />
						</linearGradient>
						<radialGradient
							id="pal-sheen"
							cx="0.5"
							cy="0.5"
							r="0.5"
						>
							<stop
								offset="0"
								stop-color="#ffffff"
								stop-opacity="0.14"
							/>
							<stop
								offset="0.7"
								stop-color="#ffffff"
								stop-opacity="0.06"
							/>
							<stop
								offset="1"
								stop-color="#ffffff"
								stop-opacity="0"
							/>
						</radialGradient>
						<clipPath id="pal-squircle">
							<rect
								x="4"
								y="4"
								width="120"
								height="120"
								rx="28"
							/>
						</clipPath>
					</defs>

					<rect
						x="4"
						y="4"
						width="120"
						height="120"
						rx="28"
						fill="url(#pal-bg)"
					/>

					<g clip-path="url(#pal-squircle)">
						<ellipse
							cx="34"
							cy="14"
							rx="96"
							ry="62"
							fill="url(#pal-sheen)"
						/>
					</g>

					<g clip-path="url(#pal-squircle)">
						<circle cx="56" cy="50" r="18" fill="#ffffff" />
						<path d="M26 102 a30 27 0 0 1 60 0 z" fill="#ffffff" />
					</g>

					<circle
						cx="92"
						cy="88"
						r="23"
						fill="#34A853"
						stroke="#ffffff"
						stroke-width="6"
					/>
					<path
						d="M82 88.5 l7 7 l14 -14"
						stroke="#ffffff"
						stroke-width="7"
						fill="none"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
				<span class="brand-name">Preferred Account Login</span>
			</div>

			<div class="topbar-actions">
				<button
					type="button"
					class="icon-button"
					id="themeToggle"
					aria-label="Switch to dark theme"
					aria-pressed="false"
					title="Switch theme"
				>
					<svg
						class="icon-sun"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						aria-hidden="true"
					>
						<circle cx="12" cy="12" r="4.2" />
						<path
							d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"
						/>
					</svg>
					<svg
						class="icon-moon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path
							d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"
						/>
					</svg>
				</button>

				<label class="master-toggle">
					<span class="status" id="masterStatus">
						<i aria-hidden="true"></i>
						<span id="masterStatusText">Active</span>
					</span>
					<span class="switch">
						<input type="checkbox" id="authuserToggle" />
						<span class="slider"></span>
					</span>
				</label>
			</div>
		</header>

		<main class="content" id="content">
			<!-- Temporary overrides: both controls here take effect without
			     waiting on Save Changes, which is why they sit apart from the
			     rule list. -->
			<section class="section">
				<h2 class="section-caption">Overrides</h2>
				<div class="group">
					<div class="line" id="pauseBar">
						<div class="line-text">
							<b>Pause everything</b>
							<small>Sign in with any account for a while</small>
						</div>
						<div class="pause-controls" id="pauseControls">
							<div class="segmented">
								<button
									type="button"
									class="pause-btn"
									data-minutes="10"
								>
									10 min
								</button>
								<button
									type="button"
									class="pause-btn"
									data-minutes="15"
								>
									15 min
								</button>
								<button
									type="button"
									class="pause-btn"
									data-minutes="30"
								>
									30 min
								</button>
							</div>
						</div>
						<div class="pause-active" id="pauseActive" hidden>
							<span class="pause-status">
								Resumes in
								<strong id="pauseCountdown"></strong>
							</span>
							<button
								type="button"
								class="button text"
								id="pauseResumeButton"
							>
								Resume now
							</button>
						</div>
					</div>

					<label class="line" for="holidayTodayToggle">
						<div class="line-text">
							<b>Today is a holiday</b>
							<small>
								<span id="holidayTodayDate"></span> · pauses
								rules that opt in
							</small>
						</div>
						<span class="switch">
							<input type="checkbox" id="holidayTodayToggle" />
							<span class="slider"></span>
						</span>
					</label>

					<div class="line line-stack">
						<div class="line-row">
							<div class="line-text">
								<b>Holiday dates</b>
								<small>Marked days rules can skip</small>
							</div>
							<div class="holiday-add">
								<input
									type="date"
									id="holidayDateInput"
									aria-label="Holiday date"
								/>
								<button
									type="button"
									class="button text"
									id="holidayAddButton"
								>
									Mark date
								</button>
							</div>
						</div>
						<div class="error-message" id="holidayError"></div>
						<div class="holiday-chips" id="holidayChips"></div>
					</div>
				</div>
			</section>

			<section class="section">
				<h2 class="section-caption">
					Rules <span id="ruleCount" class="count"></span>
				</h2>
				<div class="group" id="domainEmailList">
					<!-- Rule rows are inserted here -->
				</div>
			</section>
		</main>

		<footer class="footer">
			<div class="footer-row">
				<div class="menu-wrapper">
					<button
						type="button"
						class="icon-button bordered"
						id="moreButton"
						aria-label="Export or import rules"
						aria-haspopup="true"
						aria-expanded="false"
						title="Export or import"
					>
						<svg
							viewBox="0 0 24 24"
							fill="currentColor"
							aria-hidden="true"
						>
							<circle cx="5" cy="12" r="1.7" />
							<circle cx="12" cy="12" r="1.7" />
							<circle cx="19" cy="12" r="1.7" />
						</svg>
					</button>
					<div class="menu" id="moreMenu" hidden>
						<button type="button" id="exportButton">
							Export rules
						</button>
						<button type="button" id="importButton">
							Import rules
						</button>
					</div>
				</div>

				<span class="spacer"></span>

				<button class="button outlined disabled" id="addButton">
					Add domain
				</button>
				<button class="button filled disabled" id="saveButton">
					Save Changes
				</button>
			</div>
			<div
				class="transfer-status"
				id="transferStatus"
				role="status"
				aria-live="polite"
			></div>
			<input
				type="file"
				id="importFile"
				accept="application/json,.json"
				hidden
			/>
		</footer>

		<script src="rules.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
