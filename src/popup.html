<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Authuser Config</title>
		<link rel="stylesheet" href="popup.css" />
	</head>

	<body>
		<div class="heading-wrapper">
			<div class="heading">
				<svg
					class="brand-icon"
					viewBox="0 0 128 128"
					xmlns="http://www.w3.org/2000/svg"
					aria-hidden="true"
					focusable="false"
				>
					<defs>
						<linearGradient id="pal-bg" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0" stop-color="#5b93f7" />
							<stop offset="1" stop-color="#1a5fd0" />
						</linearGradient>
						<radialGradient
							id="pal-sheen"
							cx="0.5"
							cy="0.5"
							r="0.5"
						>
							<stop
								offset="0"
								stop-color="#ffffff"
								stop-opacity="0.14"
							/>
							<stop
								offset="0.7"
								stop-color="#ffffff"
								stop-opacity="0.06"
							/>
							<stop
								offset="1"
								stop-color="#ffffff"
								stop-opacity="0"
							/>
						</radialGradient>
						<clipPath id="pal-squircle">
							<rect
								x="4"
								y="4"
								width="120"
								height="120"
								rx="28"
							/>
						</clipPath>
					</defs>

					<rect
						x="4"
						y="4"
						width="120"
						height="120"
						rx="28"
						fill="url(#pal-bg)"
					/>

					<!-- subtle top-left highlight, fading out with no hard edge -->
					<g clip-path="url(#pal-squircle)">
						<ellipse
							cx="34"
							cy="14"
							rx="96"
							ry="62"
							fill="url(#pal-sheen)"
						/>
					</g>

					<!-- avatar: head + shoulders -->
					<g clip-path="url(#pal-squircle)">
						<circle cx="56" cy="50" r="18" fill="#ffffff" />
						<path d="M26 102 a30 27 0 0 1 60 0 z" fill="#ffffff" />
					</g>

					<!-- checkmark badge -->
					<circle
						cx="92"
						cy="88"
						r="23"
						fill="#34A853"
						stroke="#ffffff"
						stroke-width="6"
					/>
					<path
						d="M82 88.5 l7 7 l14 -14"
						stroke="#ffffff"
						stroke-width="7"
						fill="none"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
				Preferred Account Login
			</div>
			<label class="toggle-wrapper">
				<div class="switch">
					<input type="checkbox" id="authuserToggle" />
					<span class="slider"></span>
				</div>
				<span>Enable Extension</span>
			</label>
		</div>

		<!-- Pause everything for a short while, e.g. to sign in as a
		     different account without the extension interfering. Writes to
		     storage immediately, like Enable Extension above, rather than
		     waiting on Save Changes. -->
		<div class="pause-bar" id="pauseBar">
			<div class="pause-controls" id="pauseControls">
				<span class="pause-label">Pause everything</span>
				<div class="pause-buttons">
					<button
						type="button"
						class="textButton pause-btn"
						data-minutes="10"
					>
						10 min
					</button>
					<button
						type="button"
						class="textButton pause-btn"
						data-minutes="15"
					>
						15 min
					</button>
					<button
						type="button"
						class="textButton pause-btn"
						data-minutes="30"
					>
						30 min
					</button>
				</div>
			</div>
			<div class="pause-active" id="pauseActive" hidden>
				<span class="pause-status"
					>Paused · resumes in
					<strong id="pauseCountdown"></strong
				></span>
				<button type="button" class="textButton" id="pauseResumeButton">
					Resume now
				</button>
			</div>
		</div>

		<!-- Shared holiday dates. Rules opt in with "Pause on holidays". -->
		<div class="holiday-bar">
			<div class="holiday-controls">
				<label class="holiday-today">
					<input type="checkbox" id="holidayTodayToggle" />
					<span
						>Today is a holiday <small id="holidayTodayDate"></small
					></span>
				</label>
				<div class="holiday-add">
					<input type="date" id="holidayDateInput" />
					<button class="textButton" id="holidayAddButton">
						Mark date
					</button>
				</div>
			</div>
			<div class="error-message" id="holidayError"></div>
			<div class="holiday-chips" id="holidayChips"></div>
		</div>

		<div class="domain-email-list" id="domainEmailList">
			<!-- Dynamic content will be inserted here -->
		</div>
		<div class="footer">
			<div class="button-row">
				<button class="textButton" id="exportButton">Export</button>
				<button class="textButton" id="importButton">Import</button>
				<button class="addButton disabled" id="addButton">
					Add Domain
				</button>
				<button class="saveButton disabled" id="saveButton">
					Save Changes
				</button>
			</div>
			<div
				class="transfer-status"
				id="transferStatus"
				role="status"
				aria-live="polite"
			></div>
			<input
				type="file"
				id="importFile"
				accept="application/json,.json"
				hidden
			/>
		</div>
		<script src="rules.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
